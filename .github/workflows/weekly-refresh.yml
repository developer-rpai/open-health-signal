name: weekly-refresh

on:
  schedule:
    # Monday 12:00 UTC. This is the weekly cadence (the default).
    - cron: "0 12 * * 1"
    # Every day at 14:00 UTC. Runs only when the repository variable
    # NEWSLETTER_CADENCE is exactly daily. Otherwise this schedule is skipped.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      auto_send:
        description: "Send this draft without waiting for owner approval"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [issue-approved]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Manual runs and owner approval always proceed. A cron proceeds only when
    # it matches NEWSLETTER_CADENCE (empty or weekly → Monday; daily → 14:00 UTC).
    # Keep this expression in step with inflammon.newsletter.cadence.schedule_matches.
    if: >-
      github.event_name != 'schedule' ||
      (github.event.schedule == '0 14 * * *' && vars.NEWSLETTER_CADENCE == 'daily') ||
      (github.event.schedule == '0 12 * * 1' && (vars.NEWSLETTER_CADENCE == 'weekly' || vars.NEWSLETTER_CADENCE == ''))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test signal math, list tokens, and webhook verification
        run: |
          pytest
          node --test tests/mailing.test.mjs
      - name: Refresh public sources
        if: github.event_name != 'repository_dispatch'
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_TOOL: inflammon
        run: python -m inflammon refresh
      - name: Build the newsletter draft
        if: github.event_name != 'repository_dispatch' && vars.NEWSLETTER_AUTO_SEND != '1' && (github.event_name != 'workflow_dispatch' || inputs.auto_send == false)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSLETTER_POSTAL_ADDRESS: ${{ vars.NEWSLETTER_POSTAL_ADDRESS }}
          NEWSLETTER_CADENCE: ${{ vars.NEWSLETTER_CADENCE }}
          SITE_URL: ${{ vars.SITE_URL }}
          NEWSLETTER_DRY_RUN: "1"
        run: python -m inflammon newsletter
      - name: Commit snapshot and draft
        if: github.event_name != 'repository_dispatch'
        run: |
          git config user.name "inflammon-refresh"
          git config user.email "inflammon-refresh@users.noreply.github.com"
          git add data/snapshot web/data data/newsletter web/public/newsletter
          git diff --staged --quiet || git commit -m "Refresh public-data snapshot and newsletter draft"
          git push
      - name: Send the approved issue
        if: github.event_name == 'repository_dispatch' || vars.NEWSLETTER_AUTO_SEND == '1' || (github.event_name == 'workflow_dispatch' && inputs.auto_send)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          UNSUBSCRIBE_HMAC_SECRET: ${{ secrets.UNSUBSCRIBE_HMAC_SECRET }}
          FUNCTIONS_BASE: ${{ vars.FUNCTIONS_BASE }}
          NEWSLETTER_POSTAL_ADDRESS: ${{ vars.NEWSLETTER_POSTAL_ADDRESS }}
          NEWSLETTER_CADENCE: ${{ vars.NEWSLETTER_CADENCE }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Dry-run unless the repository variable NEWSLETTER_DRY_RUN is exactly 0.
          NEWSLETTER_DRY_RUN: ${{ vars.NEWSLETTER_DRY_RUN == '0' && '0' || '1' }}
        run: |
          if [ "${NEWSLETTER_DRY_RUN}" = "0" ] && [ -z "${NEWSLETTER_POSTAL_ADDRESS}" ]; then
            echo "NEWSLETTER_POSTAL_ADDRESS is required before a live send."
            exit 1
          fi
          python -m inflammon newsletter --send
