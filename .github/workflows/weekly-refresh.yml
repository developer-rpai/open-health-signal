name: weekly-refresh

on:
  schedule:
    # Monday 12:00 UTC. Spike detection uses complete weeks, so the job
    # runs once a week rather than every day.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      send_newsletter:
        description: "Send this issue through the newsletter provider"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test signal math
        run: pytest
      - name: Refresh public sources
        env:
          OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_TOOL: inflammon
        run: python -m inflammon refresh
      - name: Build the newsletter
        env:
          NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          NEWSLETTER_POSTAL_ADDRESS: ${{ vars.NEWSLETTER_POSTAL_ADDRESS }}
          SITE_URL: ${{ vars.SITE_URL }}
          # Scheduled runs send only when the repository variable NEWSLETTER_SEND is 1.
          # A manual run sends only when the send_newsletter input is checked.
          NEWSLETTER_SEND: ${{ github.event_name == 'workflow_dispatch' && (inputs.send_newsletter && '1' || '0') || vars.NEWSLETTER_SEND }}
        run: python -m inflammon newsletter
      - name: Commit snapshot
        run: |
          git config user.name "inflammon-refresh"
          git config user.email "inflammon-refresh@users.noreply.github.com"
          git add data/snapshot web/data data/newsletter web/public/newsletter
          git diff --staged --quiet || git commit -m "Refresh weekly public-data snapshot"
          git push
