name: weekly-refresh

on:
  schedule:
    # Monday 12:00 UTC. Spike detection uses complete weeks, so the job
    # runs once a week rather than every day.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test signal math
        run: pytest
      - name: Refresh public sources
        run: python -m inflammon refresh
      - name: Commit snapshot
        run: |
          git config user.name "inflammon-refresh"
          git config user.email "inflammon-refresh@users.noreply.github.com"
          git add data/snapshot web/data
          git diff --staged --quiet || git commit -m "Refresh weekly public-data snapshot"
          git push
