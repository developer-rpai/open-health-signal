[project]
name = "inflammon"
version = "0.1.0"
description = "Open-source public-health signal monitor for inflammatory diseases and anti-inflammatory drug safety"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rakesh Pai" }]
keywords = ["pharmacovigilance", "faers", "openfda", "inflammatory-disease"]
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inflammon = "inflammon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inflammon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
